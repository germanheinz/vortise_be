spring:
  datasource:
    url: ${APP_DATABASE_JDBC_URL}
    username: ${APP_DATABASE_USERNAME}
    password: ${APP_DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: never
  h2:
    console:
      enabled: false
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true

server:
  address: 127.0.0.1
  port: 18081
app:
  uploads:
    dir: ${APP_E2E_UPLOADS_DIR}
  password-mail:
    enabled: false
  superadmin:
    email: ""
    password: ""
  stripe:
    secret-key: ""
    webhook-secret: ""
    price-basic: ""
    price-pro: ""
  features:
    gastos-fijos-enabled: false
  demo:
    reset-enabled: false
logging:
  level:
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
