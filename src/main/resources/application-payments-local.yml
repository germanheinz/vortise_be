# Disposable payments lab only. Never use the workspace H2 or a hosted database.
spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:15433/gestion_payments_test
    username: gestion_payments_test
    password: ${PAYMENTS_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
  sql:
    init:
      mode: never
  h2:
    console:
      enabled: false
server:
  address: 127.0.0.1
  port: 18080
app:
  stripe:
    test-clock: ${STRIPE_TEST_CLOCK:}
  frontend-url: http://localhost:3000
logging:
  level:
    root: WARN
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
    org.springframework.security: ERROR
