spring:
  datasource:
    url: jdbc:h2:file:./data/gestiondb;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 52MB
server:
  port: ${PORT:8080}
  address: 0.0.0.0
app:
  superadmin:
    email: super@admin.com
    password: SuperSuper26!!
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    price-basic: ${STRIPE_PRICE_BASIC:}
    price-pro: ${STRIPE_PRICE_PRO:}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  uploads:
    dir: ${APP_UPLOADS_DIR:./data/uploads/avatars}
