spring:
  datasource:
    url: jdbc:h2:file:./data/gestiondb;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      # Legacy schema.sql is retained for local H2 only; staging disables script initialization.
      mode: always
  h2:
    console:
      enabled: false
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  flyway:
    enabled: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 52MB
server:
  port: ${PORT:8080}
  address: 0.0.0.0
app:
  security:
    jwt-secret: ${APP_JWT_SECRET:}
  environment:
    synthetic-data: ${APP_SYNTHETIC_DATA:false}
    storage-isolated: ${APP_STORAGE_ISOLATED:false}
  features:
    gastos-fijos-enabled: ${APP_GASTOS_FIJOS_ENABLED:false}
  demo:
    reset-enabled: ${APP_DEMO_RESET_ENABLED:false}
  superadmin:
    email: ${APP_SUPERADMIN_EMAIL:}
    password: ${APP_SUPERADMIN_PASSWORD:}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    price-basic: ${STRIPE_PRICE_BASIC:}
    price-pro: ${STRIPE_PRICE_PRO:}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  uploads:
    dir: ${APP_UPLOADS_DIR:./data/uploads/avatars}
